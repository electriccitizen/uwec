uwec_reports.index:
  path: '/admin/reports/uwec'
  defaults:
    _controller: '\Drupal\system\Controller\SystemController::systemAdminMenuBlockPage'
    _title: 'UWEC Reports'
  requirements:
    _permission: 'view uwec reports index'

uwec_reports.manual_profiles:
  path: '/admin/reports/uwec/manual_profiles'
  defaults:
    _controller: '\Drupal\uwec_reports\Controller\ManualProfiles::index'
    _title: 'Manual Profiles Report'
  requirements:
    _permission: 'view manual profiles report'

uwec_reports.inaccessible_videos:
  path: '/admin/reports/uwec/inaccessible_videos'
  defaults:
    _controller: '\Drupal\uwec_reports\Controller\InaccessibleVideos::index'
    _title: 'Inaccessible Videos Report'
  requirements:
    _permission: 'view inaccessible videos report'

uwec_reports.slate_programs:
  path: '/admin/reports/uwec/slate_programs'
  defaults:
    _controller: '\Drupal\uwec_reports\Controller\SlatePrograms::index'
    _title: 'Slate Programs Report'
  requirements:
    _permission: 'view slate programs report'
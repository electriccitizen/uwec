uwec_reports.index:
  path: '/admin/reports/uwec'
  defaults:
    _controller: '\Drupal\system\Controller\SystemController::systemAdminMenuBlockPage'
    _title: 'UWEC Reports'
  requirements:
    _permission: 'view uwec reports index'

uwec_reports.manual_profiles:
  path: '/admin/reports/uwec/manual_profiles'
  defaults:
    _controller: '\Drupal\uwec_reports\Controller\ManualProfiles::index'
    _title: 'Manual Profiles Report'
  requirements:
    _permission: 'view manual profiles report'